project:
  render:
    - wp.qmd
    - slides/rpd-talk.qmd


# Deliberately no project-level `format:` block. Both documents in the render
# list declare their own -- wp.qmd `academic-typst`, the deck `beamer` -- and a
# document-level format replaces the project-level one entirely, so anything set
# here would be dead config for both. The LaTeX block that used to live here
# (lscape macros, gt_packages.sty, fontfamily: libertinus) went with the move to
# Typst; gt_packages.sty is still needed by the thesis, which renders via LaTeX.

keywords: [unemployment insurance, income substitution, Mexico, RPD, labor economics]

bibliography: references.bib
license: "CC BY-NC"

references: references.bib
citeproc: true
